<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Knowledge Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #f0f2f5;
        }
        .card {
            background: #fff; padding: 40px; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 380px;
        }
        .card h1 {
            text-align: center; font-size: 22px; color: #1a1a1a; margin-bottom: 28px;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500;
        }
        .field input {
            width: 100%; padding: 10px 12px; font-size: 15px;
            border: 1px solid #d9d9d9; border-radius: 6px; outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
        .field input:disabled { background: #f5f5f5; cursor: not-allowed; }
        button {
            width: 100%; padding: 10px; font-size: 16px; font-weight: 500;
            background: #1677ff; color: #fff; border: none; border-radius: 6px;
            cursor: pointer; transition: background 0.2s; margin-top: 6px;
        }
        button:hover { background: #4096ff; }
        button:disabled { background: #a0c4ff; cursor: not-allowed; }
        .msg {
            margin-top: 16px; padding: 10px 14px; border-radius: 6px;
            font-size: 14px; display: none;
        }
        .msg.error { display: block; background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
        .msg.success { display: block; background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .msg.info { display: block; background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; }
        .email-display {
            background: #f9f9f9; padding: 10px 12px; border-radius: 6px;
            font-size: 14px; color: #666; border: 1px solid #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>创建账号</h1>
        <div id="msg" class="msg"></div>

        <form id="registerForm">
            <div class="field">
                <label for="email">邮箱</label>
                <div id="emailDisplay" class="email-display">—</div>
            </div>
            <div class="field">
                <label for="password">设置密码</label>
                <input type="password" id="password" placeholder="至少 6 位密码" minlength="6" required>
            </div>
            <button type="submit" id="submitBtn">注册</button>
        </form>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");

        (async function () {
            const msg = document.getElementById("msg");
            const emailDisplay = document.getElementById("emailDisplay");
            const form = document.getElementById("registerForm");
            const passwordInput = document.getElementById("password");
            const submitBtn = document.getElementById("submitBtn");

            if (!token) {
                msg.className = "msg error";
                msg.textContent = "无效的链接：缺少 token 参数";
                submitBtn.disabled = true;
                return;
            }

            // 查询 token 信息，显示邮箱
            try {
                const infoRes = await fetch("/user/invite-info?token=" + encodeURIComponent(token));
                if (infoRes.ok) {
                    const info = await infoRes.json();
                    emailDisplay.textContent = info.email;

                    if (info.expired) {
                        msg.className = "msg error";
                        msg.textContent = "该链接已过期，请联系管理员重新发送";
                        submitBtn.disabled = true;
                        return;
                    }
                    if (info.used) {
                        msg.className = "msg error";
                        msg.textContent = "该链接已被使用";
                        submitBtn.disabled = true;
                        return;
                    }
                } else {
                    const err = await infoRes.json();
                    msg.className = "msg error";
                    msg.textContent = err.detail || "无效的链接";
                    submitBtn.disabled = true;
                    return;
                }
            } catch (_) {
                msg.className = "msg error";
                msg.textContent = "网络错误，请刷新后重试";
                submitBtn.disabled = true;
                return;
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "注册中...";

                const password = passwordInput.value;

                try {
                    const res = await fetch("/user/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token, password })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        msg.className = "msg success";
                        msg.textContent = `注册成功！欢迎 ${data.email}`;
                        emailDisplay.textContent = data.email;
                        form.style.display = "none";
                    } else {
                        const err = await res.json();
                        msg.className = "msg error";
                        msg.textContent = err.detail || "注册失败";
                        submitBtn.disabled = false;
                        submitBtn.textContent = "注册";
                    }
                } catch (e) {
                    msg.className = "msg error";
                    msg.textContent = "网络错误，请稍后重试";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "注册";
                }
            });
        })();
    </script>
</body>
</html>
